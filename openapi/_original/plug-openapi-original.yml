  /v1/sellers/documents:
    post:
      summary: Upload de documento
      operationId: uploadSellerDocument
      description: >
        Faz upload de um documento (imagem ou PDF) para posterior associação a
        um seller.

        O arquivo fica armazenado temporariamente por 7 dias. Após esse prazo, o
        documento expira e não pode mais ser utilizado.


        **Tipos aceitos:** SELFIE, CNH_FULL, CNH_FRONT, CNH_BACK, RG_FRONT,
        RG_BACK


        **Formatos aceitos:**

        - SELFIE e CNH_FULL: PNG, JPEG, BMP, WebP, HEIC, HEIF, PDF

        - CNH_FRONT, CNH_BACK, RG_FRONT, RG_BACK: PNG, JPEG, BMP, WebP, HEIC,
        HEIF (sem PDF)


        **Tamanho máximo:** 3MB
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - SELFIE
                    - CNH_FULL
                    - CNH_FRONT
                    - CNH_BACK
                    - RG_FRONT
                    - RG_BACK
                  description: Tipo do documento
                file:
                  type: string
                  format: binary
                  description: Arquivo do documento
              required:
                - type
                - file
      responses:
        '201':
          description: Documento enviado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedDocumentResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Arquivo excede o tamanho máximo de 3MB
      tags:
        - Seller Documents
    get:
      summary: Listar documentos
      operationId: listSellerDocuments
      description: >
        Lista os documentos do cliente autenticado. Documentos expirados não são
        retornados.
      parameters:
        - name: status
          in: query
          required: false
          description: Filtrar por status do documento
          schema:
            type: string
            enum:
              - uploaded
              - attached
              - sent
        - name: type
          in: query
          required: false
          description: Filtrar por tipo do documento
          schema:
            type: string
            enum:
              - SELFIE
              - CNH_FULL
              - CNH_FRONT
              - CNH_BACK
              - RG_FRONT
              - RG_BACK
        - name: createdAt
          in: query
          required: false
          description: Filtrar documentos criados a partir desta data (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          description: Itens por página (máximo 50)
          schema:
            type: number
            default: 10
        - name: page
          in: query
          required: false
          description: Número da página
          schema:
            type: number
            default: 1
        - name: sort
          in: query
          required: false
          description: Ordenação por data de criação
          schema:
            type: string
            enum:
              - ASC
              - DESC
            default: DESC
      responses:
        '200':
          description: Lista de documentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedDocumentListResponse'
      tags:
        - Seller Documents
