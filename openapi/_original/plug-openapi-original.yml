          description: Descrição da sessão
        statementDescriptor:
          type: string
          description: Descrição a ser exibida fatura do comprador
        captchaEnabled:
          type: boolean
          description: Indica se a sessão usa verificação por CAPTCHA no Link de Pagamento.
        items:
          type: array
          description: Itens do pedido
          items:
            $ref: '#/components/schemas/SessionItemObject'
        paymentLink:
          type: string
          description: Link para acessar o Link de Pagamento desta sessão
        paymentMethods:
          type: array
          description: Métodos de pagamento disponíveis na sessão
          items:
            anyOf:
              - $ref: '#/components/schemas/PaymentMethodCardObject'
              - $ref: '#/components/schemas/PaymentMethodPixObject'
              - $ref: '#/components/schemas/PaymentMethodBoletoObject'
              - $ref: '#/components/schemas/PaymentMethodDripObjectRequest'
              - $ref: '#/components/schemas/PaymentMethodNupayObjectRequest'
        createdAt:
          type: string
          description: Data de criação da sessão
        updatedAt:
          type: string
          description: Data da atualização da sessão
        publicKey:
          type: string
          description: Chave de acesso com escopo restrito, usada para pagar a sessão
        splitRules:
          type: array
          description: >-
            Regras de split persistidas nesta sessão (quando informadas na
            criação).
          items:
            $ref: '#/components/schemas/SplitRule'
        multiplePayments:
          allOf:
            - $ref: '#/components/schemas/MultiplePayments'
          description: >
            Estado conceitual de **disponibilidade do link** para receber uma
            próxima cobrança.

            Retornado em respostas completas de sessão. Em respostas parciais de
            atualização ou pagamento, consulte `GET /v1/sessions/{id}` para
            obter o estado agregado atualizado.
    MultiplePayments:
      type: object
      description: >
        Estado do link de pagamento para receber uma próxima cobrança.


        - **Sessões 1:1** retornam `allow=false`, `maxPayments=null` e `status`
        derivado da disponibilidade do link.

        - **Sessões 1:N** (criadas com `maxPayments`) retornam `allow=true` e
        `status` reflete capacidade restante e estado da sessão.
      properties:
        allow:
          type: boolean
          description: >
            `true` em sessões 1:N (com `maxPayments` configurado); `false` em
            sessões 1:1.
        maxPayments:
          type: integer
          nullable: true
          description: >
            Limite configurado para a sessão.

            `-1` indica ilimitado, valores entre `1` e `99999` indicam limite
            finito; `null` em sessões 1:1.
        paymentCount:
          type: integer
          description: Quantidade de pagamentos já autorizados neste link.
        pendingCount:
          type: integer
          description: >
            Quantidade de reservas pendentes de confirmação assíncrona neste
            link (ex.: Pix em aberto).
        status:
          type: string
          enum:
            - active
            - disabled
            - canceled
          description: >
            Disponibilidade conceitual do link para próxima cobrança:


            - `active`: link disponível.

            - `disabled`: link temporariamente indisponível (ex.:
            `isActive=false`, expiração por `dueDate`, ou limite atingido em
            1:N). Estado reversível.

            - `canceled`: link cancelado ou anulado, estado terminal.


            O campo raiz `status` da sessão segue mantendo apenas `created`,
            `paid`, `canceled` ou `voided`.
    SessionItemObject:
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: >
            Identificador estável do item, gerado pela Malga na criação da
            sessão. Retornado em respostas de sessão (`GET /v1/sessions/{id}`,
            criação e Link de Pagamento). Ignorado em requests — não é
            necessário enviar em `POST /v1/sessions`.
        name:
          type: string
          description: Nome do item da sessão
        description:
          type: string
          description: Descrição do item da sessão
        unitPrice:
          type: integer
          minimum: 0
          description: Preço unitário em centavos do item, exemplo 100 para cobrar R$ 1,00
        quantity:
          type: integer
          minimum: 1
          description: Define a quantidade de itens
        tangible:
          type: boolean
          description: Determina se o item é tangível
        categoryId:
          type: string
          description: Identificador da categoria do item
      required:
        - name
        - unitPrice
        - quantity
    SessionHistoryResponse:
      type: array
      items:
        $ref: '#/components/schemas/SessionHistoryItem'
    SessionHistoryItem:
      type: object
      description: >
        Registro de auditoria de um evento na sessão. O item não retorna campos
        de nível raiz como `chargeId` nem metadados de sistema.
      properties:
        id:
          type: string
          format: uuid
          description: >-
            Identificador do registro de histórico (não confundir com o `id` da
            sessão no path).
        status:
          type: string
          enum:
            - created
            - paid
            - canceled
            - voided
            - disabled
          description: >
            Status da sessão na leitura do produto no momento do evento. O valor
            `disabled` indica desativação automática por `dueDate` ou limite de
            pagamentos 1:N; cancelamento manual permanece `canceled`.
        createdAt:
          type: string
          format: date-time
          description: >-
            Data de criação do registro (RFC 3339, com precisão de
            milissegundos).
        updatedAt:
          type: string
          format: date-time
          description: Data da última atualização do registro.
        clientId:
          type: string
          format: uuid
          description: >-
            Identificador do cliente Malga associado ao registro, quando
            preenchido.
        merchantId:
          type: string
          format: uuid
          description: Identificador do merchant associado ao registro, quando preenchido.
        action:
          type: string
          nullable: true
          description: >
            Ação principal derivada de `actions`, com prioridade documentada
            (ex.: `statusChanged`, `sessionExpiredByDueDate`,
            `paymentSucceeded`). Pode ser omitida (`null`) quando o `diff`
            indica expiração por `dueDate` mas `actions` não lista
            `sessionExpiredByDueDate`.
        actions:
          type: array
          items:
            type: string
          description: >
            Lista completa de ações semânticas do evento. Valores possíveis
            incluem `statusChanged`, `amountChanged`, `isActiveChanged`,
            `paymentSucceeded`, `paymentPending`, `paymentExpired`,
            `sessionExpiredByDueDate`, `sessionExpiredByMaxPayments`,
            `splitRulesChanged`, entre outros.
        diff:
          type: object
          additionalProperties: true
          description: >
            Objeto JSON com mudanças (`changes.*`), razões estáveis (`reason`,
            `changes.isActive.reason`) e contexto (ex.: `maxPaymentsContext`,
            resposta da tentativa de cobrança em `changes.response`). A
            estrutura varia conforme o fluxo.
      required:
        - id
        - status
        - createdAt
        - updatedAt
