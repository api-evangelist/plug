    BankAccount:
      type: object
      properties:
        holderName:
          type: string
          description: Nome de identificador do portador da conta bancária
        holdeType:
          type: string
          enum:
            - individual
            - company
          description: >-
            Identifica se é pessoa física ou jurídica. aceita os valores
            'individual' ou 'company'
        holderDocument:
          type: string
          description: Documento do portador da conta bancária
        bank:
          type: string
          nullable: true
          description: >-
            Código COMPE do banco (3 dígitos). Opcional desde que `ispb` seja
            informado; quando ambos vêm, `ispb` tem precedência.
        ispb:
          type: string
          nullable: true
          pattern: ^[0-9]{8}$
          minLength: 8
          maxLength: 8
          description: >-
            Identificador ISPB da instituição financeira (8 dígitos numéricos).
            Pelo menos um entre `bank` e `ispb` deve ser informado.
        branchNumber:
          type: string
          description: Número da agência bancária
        branchCheckDigit:
          type: string
          description: Código verificador da agência bancária
        accountNumber:
          type: string
          description: Número da conta bancária
        accountCheckDigit:
          type: string
          description: Número verificador da conta bancária
        pixKey:
          type: string
          description: Chave pix associada a conta bancária
        type:
          type: string
          enum:
            - conta_corrente
            - conta_poupanca
            - conta_corrente_conjunta
            - conta_poupanca_conjunta
          description: Tipo de conta
      required:
        - holderName
        - holderDocument
        - branchNumber
        - accountNumber
        - type
