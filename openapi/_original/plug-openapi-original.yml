                  $ref: '#/components/examples/CancelSession201Response'
      tags:
        - Sessions
  /v1/sessions/{id}/history:
    get:
      summary: Recuperar o histórico da sessão
      operationId: getSessionHistory
      description: >
        Retorna a trilha de auditoria da sessão em ordem decrescente de criação,
        com os registros mais recentes primeiro: alterações de campos,
        tentativas de pagamento, confirmações assíncronas e expirações.


        Cada item representa um **registro de histórico** (`id` do evento), não
        o identificador da sessão. Use `action` (ação principal derivada) e
        `actions` (lista completa) junto com `diff` para entender o que ocorreu.


        O campo `status` em cada item segue a **semântica de produto** na
        leitura: expirações automáticas por `dueDate` ou limite 1:N podem
        aparecer como `disabled`, mesmo quando o status persistido no registro
        era `created`.


        Para o estado atual da sessão e de `multiplePayments`, consulte `GET
        /v1/sessions/{id}`. O histórico não substitui essa consulta.
      parameters:
        - name: id
          required: true
          description: Identificação da sessão
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionHistoryResponse'
              examples:
                SessionHistoryResponse:
                  $ref: '#/components/examples/SessionHistoryResponse'
        '400':
          description: >-
            Header `X-Client-Id` ausente ou identificador da sessão ausente no
            path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Sessão não encontrada para o par `id` + `X-Client-Id`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno inesperado ao recuperar o histórico da sessão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Sessions
  /v1/sessions/{id}/link:
    get:
      summary: Recupera sessão com os dados das configurações da empresa
      operationId: getSessionWithSettings
      description: >
        Retorna a sessão completa junto das configurações da empresa usadas no
        Link de Pagamento. Também inclui `multiplePayments` para indicar a
        disponibilidade agregada do link em sessões 1:1 e 1:N.
      parameters:
