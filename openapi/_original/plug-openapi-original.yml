          type: boolean
          description: Indica se a assinatura está em modo de produção
          example: true
        interval:
          type: string
          enum:
            - weekly
            - monthly
            - quarterly
            - yearly
            - biennial
            - triennial
          description: Intervalo de recorrência
          example: monthly
        createdAt:
          type: string
          format: date-time
          description: Data de criação da assinatura
          example: '2025-07-30T20:14:12.191866Z'
        updatedAt:
          type: string
          format: date-time
          description: Data da última atualização da assinatura
          example: '2025-07-31T16:57:23.751952Z'
    RetryPolicyRule:
      type: object
      properties:
        daysAfterLastAttempt:
          type: integer
          minimum: 1
          maximum: 30
          description: Dias após a última tentativa para fazer nova retentativa
          example: 1
      required:
        - daysAfterLastAttempt
    UpdateClientSettingsRequest:
      type: object
      properties:
        retryPolicy:
          type: array
          items:
            $ref: '#/components/schemas/RetryPolicyRule'
          minItems: 1
          maxItems: 6
          description: Política de retentativas para pagamentos falhados
          example:
            - daysAfterLastAttempt: 1
            - daysAfterLastAttempt: 4
            - daysAfterLastAttempt: 9
            - daysAfterLastAttempt: 16
        statementDescriptor:
          type: string
          maxLength: 25
          description: Texto que aparece na fatura do cartão de crédito
          example: MINHA EMPRESA
        cancelAfterAllRetries:
          type: boolean
          description: >-
            Se a assinatura deve ser cancelada após todas as retentativas
            falharem
          example: false
    ClientSettingsResponse:
      type: object
      properties:
        clientId:
          type: string
          format: uuid
          description: Identificador do cliente
          example: e234eeb3-483d-4df2-87eb-1e2be5cdaccd
        retryPolicy:
          type: array
          items:
            $ref: '#/components/schemas/RetryPolicyRule'
          description: Política de retentativas configurada
          example:
            - daysAfterLastAttempt: 1
            - daysAfterLastAttempt: 4
            - daysAfterLastAttempt: 9
            - daysAfterLastAttempt: 16
        statementDescriptor:
          type: string
          description: Texto que aparece na fatura do cartão de crédito
          example: MINHA EMPRESA
        cancelAfterAllRetries:
          type: boolean
          description: >-
            Se a assinatura deve ser cancelada após todas as retentativas
            falharem
          example: false
        createdAt:
          type: string
          format: date-time
          description: Data de criação das configurações
          example: '2025-01-31T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Data da última atualização das configurações
          example: '2025-01-31T15:30:00Z'
      required:
