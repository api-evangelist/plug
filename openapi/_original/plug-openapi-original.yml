  /v1/sessions:
    get:
      summary: Listar sessões
      operationId: listSessions
      description: >
        Lista as sessões do cliente autenticado, com paginação e filtros
        opcionais.


        Sem o header `X-Client-Id`, a API responde `200` com `items` vazio e
        metadados de paginação padrão (não retorna erro).
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          required: false
          description: Número da página a ser listada (mínimo 1)
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          required: false
          description: Quantidade de registros por página (padrão 10; máximo 100)
        - in: query
          name: order
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          required: false
          description: >
            Aceito como `asc` ou `desc` (padrão `desc`; valores inválidos caem
            para `desc`).

            A listagem atual ordena sempre por `createdAt` decrescente.
        - in: query
          name: id
          schema:
            type: string
            format: uuid
          required: false
          description: Filtra pelo identificador da sessão
        - in: query
          name: status
          schema:
            type: string
            enum:
              - created
              - paid
              - canceled
              - voided
          required: false
          description: >-
            Filtra por status da sessão. Aceita múltiplos valores separados por
            vírgula
        - in: query
          name: isActive
          schema:
            type: string
            enum:
              - 'true'
              - 'false'
          required: false
          description: >-
            Filtra sessões ativadas ou desativadas. Aceita múltiplos valores
            separados por vírgula (`true` e/ou `false`)
        - in: query
          name: merchantId
          schema:
            type: string
            format: uuid
          required: false
          description: Filtra pelo identificador do merchant
        - in: query
          name: orderId
          schema:
            type: string
            minLength: 2
          required: false
          description: >-
            Filtra pelo identificador do pedido. Se informado, deve ter no
            mínimo 2 caracteres Unicode após o trim
        - in: query
          name: multiplePayments.status
          schema:
            type: string
            enum:
              - active
              - disabled
              - canceled
          required: false
          description: >
            Filtra pela disponibilidade agregada do link
            (`multiplePayments.status`). Aceita múltiplos valores separados por
            vírgula.

            `disabled` cobre links temporariamente indisponíveis, incluindo
            expiração por `dueDate`.
        - in: query
          name: created.gt
          schema:
            type: string
            format: date-time
          required: false
          description: >-
            Filtra sessões com `createdAt` estritamente maior que o instante
            informado (RFC 3339 ou RFC 3339 com fração de segundos)
          example: '2026-03-24T03:00:00.000Z'
        - in: query
          name: created.lt
          schema:
            type: string
            format: date-time
          required: false
          description: >-
            Filtra sessões com `createdAt` estritamente menor que o instante
            informado (RFC 3339 ou RFC 3339 com fração de segundos)
          example: '2026-04-01T02:59:00.000Z'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
              examples:
                SessionList:
                  $ref: '#/components/examples/SessionList'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Sessions
    post:
      summary: Criar nova sessão
      operationId: createSession
      description: >
        Cria uma sessão de pagamento. Quando `maxPayments` é omitido, a sessão
        segue o fluxo 1:1 legado. Quando `maxPayments` é enviado, a sessão opera
        como link 1:N e a resposta completa retorna `multiplePayments` com a
        disponibilidade agregada para próximas cobranças.


        **Restrição pix/boleto em 1:N:** métodos `pix` e `boleto` não podem ser
        combinados com `maxPayments` finito maior que `1`. Nesse caso a API
        retorna `422` com `businessCode:
        "pix_boleto_multiple_payments_not_allowed"`. `maxPayments` omitido,
        `null`, `1` ou `-1` (ilimitado) continua permitido para pix/boleto. O
        bloqueio não se aplica a cartão de crédito.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSession'
            examples:
              CreateSessionRequest:
                $ref: '#/components/examples/CreateSessionRequest'
              CreateSessionRequest1NFixed:
                $ref: '#/components/examples/CreateSessionRequest1NFixed'
              CreateSessionRequest1NUnlimited:
                $ref: '#/components/examples/CreateSessionRequest1NUnlimited'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              examples:
                Session:
                  $ref: '#/components/examples/Session'
                Session1N:
                  $ref: '#/components/examples/Session1N'
        '422':
          description: >
            Unprocessable Entity. Regras de negócio bloquearam a criação da
            sessão. O envelope segue o formato padrão de erro, com
            `businessCode` identificando a regra violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                PixBoletoMultiplePaymentsNotAllowed:
                  summary: Pix/boleto com maxPayments > 1
                  value:
                    error:
                      type: bad_request
                      code: 422
                      message: >-
                        PIX and boleto payment methods do not support
                        maxPayments greater than 1.
                      businessCode: pix_boleto_multiple_payments_not_allowed
                      details: []
                PlatformFeeExceedsLinkAmount:
                  summary: Taxa de plataforma maior ou igual ao valor do link
                  value:
                    error:
                      type: bad_request
                      code: 422
                      message: >-
                        Calculated platform fee must be less than the link total
                        amount.
                      businessCode: platform_fee_exceeds_link_amount
                      details: []
      tags:
        - Sessions
  /v1/sessions/{id}:
    get:
      summary: Recuperar detalhes de uma sessão
      operationId: getSession
      description: >
        Retorna a sessão completa. Use este endpoint como fonte do estado
        agregado de `multiplePayments` após criação, pagamento, atualização,
        cancelamento ou consulta de histórico.
      parameters:
        - name: id
          required: true
          description: Identificação da sessão a ser recuperada
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              examples:
                Session:
                  $ref: '#/components/examples/Session'
      tags:
        - Sessions
    patch:
      summary: Atualizar relevância de uma sessão
      operationId: patchSession
      description: >
        Atualiza campos de relevância da sessão: `isActive` (obrigatório),
        `dueDate` e `maxPayments` (sessões 1:N). A resposta é parcial e devolve
        apenas `id` e `isActive`; após a atualização, consulte `GET
        /v1/sessions/{id}` para obter o estado completo (`status`, `dueDate`,
        `maxPayments`, `multiplePayments`, etc.).


        **Restrição de reativação pix/boleto 1:1 consumida:** `isActive: true`
        em uma sessão pix ou boleto 1:1 já paga (`maxPayments = 1` com
        `paymentCount = 1`, ou sessão legada sem `maxPayments` já `paid` com
        `paymentCount = 1`) retorna `422` com `businessCode:
        "pix_boleto_one_to_one_reactivation_blocked"`. O bloqueio ignora
        `maxPayments` enviado no PATCH.
      parameters:
        - name: id
          required: true
          description: Identificação da sessão a ser alterada
          in: path
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchSessionRequest'
            examples:
              PatchSessionRequest:
                $ref: '#/components/examples/PatchSessionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchSession200Response'
              examples:
                PatchSession200Response:
                  $ref: '#/components/examples/PatchSession200Response'
        '422':
          description: >
            Unprocessable Entity. Regras de negócio bloquearam a atualização da
            sessão. O envelope segue o formato padrão de erro, com
            `businessCode` identificando a regra violada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                PixBoletoOneToOneReactivationBlocked:
                  summary: Reativação de sessão pix/boleto 1:1 já consumida
                  value:
                    error:
                      type: bad_request
                      code: 422
                      message: >-
                        Consumed one-to-one PIX or boleto sessions cannot be
                        reactivated.
                      businessCode: pix_boleto_one_to_one_reactivation_blocked
                      details: []
      tags:
        - Sessions
  /v1/sessions/{id}/charge:
    post:
      summary: Pagar uma sessão
      operationId: paySession
      description: >
        Inicia uma cobrança para a sessão. Em sessões 1:N, cada chamada aceita
        representa uma tentativa individual dentro da capacidade configurada em
        `maxPayments`. A resposta é a cobrança criada e não retorna
        `multiplePayments`; consulte `GET /v1/sessions/{id}` para acompanhar o
        estado agregado atualizado.
      parameters:
        - name: id
          required: true
          description: Identificação da sessão a ser paga
          in: path
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaySessionRequest'
            examples:
              PaySessionCardRequest:
                $ref: '#/components/examples/PaySessionCardRequest'
              PaySessionCardRequestWithRecurrence:
                $ref: '#/components/examples/PaySessionCardRequestWithRecurrence'
              PaySessionPixRequest:
                $ref: '#/components/examples/PaySessionPixRequest'
              PaySessionDripRequest:
                $ref: '#/components/examples/PaySessionDripRequest'
              PaySessionBoletoRequest:
                $ref: '#/components/examples/PaySessionBoletoRequest'
              PaySessionNupayRequest:
                $ref: '#/components/examples/PaySessionNupayRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaySession201Response'
              examples:
                PaySession201CardResponse:
                  $ref: '#/components/examples/PaySession201CardResponse'
                PaySession201PixResponse:
                  $ref: '#/components/examples/PaySession201PixResponse'
                PaySession201DripResponse:
                  $ref: '#/components/examples/PaySession201DripResponse'
                PaySession201BoletoResponse:
                  $ref: '#/components/examples/PaySession201BoletoResponse'
                PaySession201NupayResponse:
                  $ref: '#/components/examples/PaySession201NupayResponse'
        '404':
          description: >
            Sessão não encontrada ou não pertencente ao cliente informado em
            `X-Client-Id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            Unprocessable Entity. A cobrança não pode ser processada: sellers de
            split inválidos, ou sessão 1:N indisponível (link desativado ou
            limite de pagamentos atingido). Nos casos de indisponibilidade 1:N,
            o `businessCode` é `session_disabled` ou
            `multiple_payments_limit_reached`. O envelope segue o formato padrão
            de erro.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InvalidSellers:
                  summary: Sellers de split inválidos
                  value:
                    error:
                      type: bad_request
                      code: 422
                      message: >-
                        session cannot be charged: sellers not found
                        [9f8b2c1a-4d3e-4a2b-8c7d-1e2f3a4b5c6d]
                      details: []
                MultiplePaymentsLimitReached:
                  summary: Limite de pagamentos 1:N atingido
                  value:
                    error:
                      type: bad_request
                      code: 422
                      message: multiple payments limit reached
                      businessCode: multiple_payments_limit_reached
                      details: []
      tags:
        - Sessions
  /v1/sessions/{id}/cancel:
    post:
      summary: Cancelar uma sessão
      operationId: cancelSession
      parameters:
        - name: id
          required: true
          description: Identificação da sessão a ser cancelada
          in: path
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
