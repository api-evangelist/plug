    CreateWebhookRequest:
      type: object
      properties:
        event:
          type: string
          description: >-
            Evento que deseja receber notificações no seu webhook conforme
            descrito na seção [Eventos suportados para notificação via
            webhooks](/documentations/webhooks/webhook1-1#eventos-suportados-para-notificacao-via-webhooks).
            Deve ser criado um webhook para cada evento, podendo ser utilizado o
            wildcard `*` no lugar do evento para receber todos os eventos em um
            único webhook.
        endpoint:
          type: string
          description: >-
            URL do seu sistema que deverá receber as notificações de evento, o
            valor não pode se repetir em outro webhook.
        version:
          type: number
          description: Versão da api da Malga que seu webhook implementa
          default: 1.1
        status:
          type: boolean
          enum:
            - true
            - false
          description: >-
            Identifica se o webhooks está ativo ou não para receber notificações
            de evento da Malga
          default: true
      required:
        - event
        - endpoint
        - version
        - status
