            Dia em que o parceiro será pago. Depende do transfer_interval - se
            for daily, enviar 1. Se for weekly pode ser de 1 (segunda) a 5
            (sexta). Se for monthly, pode ser de 1 a 31. Além disso, se for
            daily e o provedor for Pagar.me V5, o valor é 0.
        transferEnabled:
          type: boolean
          description: Determina se as transferências estão autorizadas a acontecer ou não.
        transferInterval:
          type: string
          enum:
            - daily
            - weekly
            - monthly
          description: Intervalo entre as transferências.
        automaticAnticipationEnabled:
          type: boolean
          description: Indica se o recebedor receberá antecipações automaticamente
        anticipatableVolumePercentage:
          type: string
          description: >-
            Indica a porcentagem do volume passível de ser antecipado para o
            recebedor
        automaticAnticipationType:
          type: string
          description: >-
            Indica o tipo de antecipação automática que será configurado para a
            conta do recebedor
        automaticAnticipationDays:
          type: string
          description: Indica a quantidade de dias de antecipação automática
        automaticAnticipation1025Delay:
          type: string
          description: >-
            Indica a quantidade de dias que serão desconsiderados na
            contabilização do valor passível de ser antecipado. A contagem de
            dias é realizada a partir do dia da antecipação para trás
    TransferPolicyCreated:
      type: object
      properties:
        id:
          type: string
          description: Identificação da transferência
        updatedAt:
          type: string
          description: Data de alteração da transferência
        createdAt:
          type: string
          description: Data de criação da transferência
        transferPolicy:
          $ref: '#/components/schemas/TransferPolicy'
    RateAgreements:
      type: array
      description: >-
        Acordo de taxas para cadastro de seller no provedor Braspag. O envio
        desse nó é opcional durante a criação do recebedor.
      items:
        type: object
        properties:
          type:
            type: string
            enum:
              - GlobalRate
              - FeePaymentMethod
            description: Cenários de acordo de taxas
          percent:
            type: number
            description: >-
              Porcentagem da taxa de desconto única (MDR único) para acordo do
              tipo GlobalRate. Valor com até duas casas decimais. Só deve ser
              enviado em caso de cadastro de seller com Taxa global.
          fee:
            type: number
            description: >-
              Taxa fixa por transação. Valor em centavos. Ex => R$ 1,00 => Fee =
              100
          merchantDiscountRates:
            type: array
            items:
              type: object
              properties:
                paymentArrangement:
                  type: object
                  properties:
                    product:
                      type: string
                      enum:
                        - CreditCard
                        - DebitCard
                      description: >-
                        Produto do arranjo de pagamento da taxa de desconto do
                        seller.
                    brand:
                      type: string
                      enum:
                        - Visa
                        - Master
                        - Amex
                        - Elo
                        - Diners
                        - Hipercard
                      description: >-
                        Bandeira do arranjo de pagamento da taxa de desconto do
                        seller. As bandeiras válidas são Visa, Master, Amex,
                        Elo, Diners e Hipercard.
                initialInstallmentNumber:
                  type: number
                  description: >-
                    Número inicial do intervalo de parcelas da taxa de desconto
                    do seller. O número de parcelas deverá ser maior do que 0 e
                    menor ou igual a 12.
                finalInstallmentNumber:
                  type: number
                  description: >-
                    Número final do intervalo de parcelas da taxa de desconto do
                    seller. O número de parcelas deverá ser maior do que 0 e
                    menor ou igual a 12.
                percent:
                  type: number
                  description: >-
                    Porcentagem da taxa de desconto do seller. Valor com até
