  /v1/settings:
    post:
      tags:
        - Settings
      summary: >-
        Configurações da empresa para personalização do checkout do link de
        pagamento, com imagem. O body deve ser enviado com form-data. Todos os
        campos são string com exceção do campo logo que é do tipo File.
      operationId: createSettings
      parameters:
        - in: header
          name: X-Merchant-Id
          schema:
            type: string
            format: uuid
          required: false
          description: >-
            Identificador do merchant. Quando informado, cria configuração
            específica para o merchant. Se omitido, cria a configuração padrão
            do cliente.
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserSettingsWithImage'
            examples:
              SettingsRequest:
                $ref: '#/components/examples/SettingsRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
              examples:
                UserSettings:
                  $ref: '#/components/examples/UserSettings'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - Settings
      summary: Atualiza configurações do link de pagamento (form-data ou JSON)
      description: >
        Atualiza a configuração do escopo informado (`X-Client-Id` e,
        opcionalmente, `X-Merchant-Id`).


        - **`multipart/form-data`:** todos os campos textuais e upload opcional
        de `logo` (File).

        - **`application/json`:** apenas campos textuais (sem upload de logo).


        Campos vazios (`""`) não são persistidos. Se nenhum campo efetivo for
        enviado (por exemplo `{}` ou somente `companyUrl` vazio) e não houver
        logo, retorna **422**.
      operationId: updateSettings
      parameters:
        - in: header
          name: X-Merchant-Id
          schema:
            type: string
            format: uuid
          required: false
          description: >-
            Identificador do merchant. Quando informado, atualiza a configuração
            específica do merchant. Se omitido, atualiza a configuração padrão
            do cliente.
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserSettingsWithImage'
            examples:
              SettingsRequest:
                $ref: '#/components/examples/SettingsRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettingsPatch'
            examples:
              SettingsPatchCompanyUrl:
                $ref: '#/components/examples/SettingsPatchCompanyUrl'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
              examples:
                UserSettings:
                  $ref: '#/components/examples/UserSettings'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Configuração não encontrada para o escopo informado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Nenhum campo efetivo para atualizar (body vazio ou apenas campos
            ignorados)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - Settings
      summary: Recupera configuração do link de pagamento personalizado do cliente
      operationId: getSetting
      parameters:
        - in: header
          name: X-Merchant-Id
          schema:
            type: string
            format: uuid
          required: false
          description: >-
            Identificador do merchant. Quando informado, busca primeiro a
            configuração do merchant; se não existir, retorna a configuração
            padrão do cliente (fallback automático).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
              examples:
                UserSettings:
                  $ref: '#/components/examples/UserSettings'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
