          example: 12000
        netAmount:
          type: integer
          format: int64
          description: Valor líquido deste recebível após o desconto, em centavos.
          example: 11594
        markupAmount:
          type: integer
          format: int64
          description: Parte do desconto correspondente ao markup do contrato, em centavos.
          example: 232
        feeAmount:
          type: integer
          format: int64
          description: Parte do desconto correspondente à taxa base da Malga, em centavos.
          example: 174
        daysToAnticipate:
          type: integer
          description: >-
            Quantos dias estão sendo antecipados em relação à data original de
            recebimento.
          example: 30
        settlementDate:
          type: string
          format: date
          description: Data prevista de recebimento original deste recebível (YYYY-MM-DD).
          example: '2026-06-15'
        paymentArrangement:
          type: string
          description: Arranjo de pagamento do recebível.
          example: vcc
      required:
        - receivableUnitExternalId
        - grossAmount
        - netAmount
        - markupAmount
        - feeAmount
        - daysToAnticipate
        - settlementDate
        - paymentArrangement
    PrepaymentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Identificador da antecipação.
          example: 01964c5a-0001-7000-8000-000000000001
        status:
          type: string
          enum:
            - pending
            - committed
            - paid
            - expired
          description: >
            Status atual da antecipação:

            - `pending`: simulação criada, ainda não aceita.

            - `committed`: aceite confirmado, antecipação em processamento.

            - `paid`: pagamento da antecipação realizado.

            - `expired`: simulação expirou (passou de 15h sem aceite) ou aceite
            recusado porque o conjunto de recebíveis mudou.
          example: pending
        grossAmount:
          type: integer
          format: int64
          description: >-
            Soma do valor original dos recebíveis incluídos em `items`, em
            centavos.
          example: 20000
        netAmount:
          type: integer
          format: int64
          description: >-
            Valor líquido a ser recebido pelo cliente após o desconto, em
            centavos.
          example: 19323
        markupAmount:
          type: integer
          format: int64
          description: Componente do desconto referente ao markup do contrato, em centavos.
          example: 387
        feeAmount:
          type: integer
          format: int64
          description: Componente do desconto referente à taxa base da Malga, em centavos.
          example: 290
        effectiveRate:
          type: number
          format: double
          description: Taxa efetiva total da antecipação sobre o valor bruto.
          example: 0.03385
        monthlyRate:
          type: number
          format: double
          description: Taxa mensal base aplicada no cálculo (decimal).
          example: 0.015
        markup:
          type: number
          format: double
          description: Markup mensal do contrato aplicado no cálculo (decimal).
          example: 0.02
        expiresAt:
          type: string
          format: date-time
          description: >-
            Data e hora limite para confirmar a antecipação (sempre 15h, horário
            de Brasília, do dia da simulação).
          example: '2026-05-27T18:00:00Z'
        endDate:
          type: string
          format: date
          description: >-
            Data-limite (YYYY-MM-DD) considerada na simulação. Todos os
            recebíveis com data de recebimento até essa data (inclusive) foram
            incluídos.
          example: '2026-06-20'
        paymentDate:
          type: string
          format: date
          description: >-
            Data prevista de pagamento da antecipação (YYYY-MM-DD). Retornada
            para simulações pendentes (D+1 se criada antes das 15h) e após o
            aceite.
          example: '2026-05-28'
        items:
          type: array
          description: Lista dos recebíveis incluídos na antecipação.
          items:
            $ref: '#/components/schemas/PrepaymentItemResponse'
      required:
        - id
        - status
        - grossAmount
        - netAmount
        - markupAmount
        - feeAmount
        - effectiveRate
        - monthlyRate
        - markup
        - expiresAt
        - items
    PrepaymentError:
      type: object
      properties:
        code:
          type: string
          description: Código interno do erro.
          enum:
            - I-400
            - I-401
            - I-403
            - I-404
            - I-409
            - I-422
          example: I-403
        networkDeniedMessage:
          type: string
          description: Mensagem detalhando o erro.
          example: Client is not eligible for prepayment
      required:
        - code
        - networkDeniedMessage
