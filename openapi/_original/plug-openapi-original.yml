        Ao atualizar a conta bancária (`bankAccount`) de um seller, o IP do
        servidor que realiza a requisição **deve** estar previamente cadastrado
        na **Allow List** (Lista de Permissões) no dashboard da Pagar.me.

        [Saiba como configurar a Allow List
        aqui.](https://docs.pagar.me/reference/atualizar-conta-banc%C3%A1ria-do-recebedor-1)
      parameters:
        - name: id
          required: true
          description: Identificador do seller
          in: path
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SellerUpdatedBody'
            examples:
              SellerRequestBusiness:
                $ref: '#/components/examples/SellerRequestBusiness'
              SellerRequestOwner:
                $ref: '#/components/examples/SellerRequestOwner'
              SellerPatchBankIdentifierSwap:
                $ref: '#/components/examples/SellerPatchBankIdentifierSwap'
      responses:
        '200':
          description: Updated
          content:
            application/json:
