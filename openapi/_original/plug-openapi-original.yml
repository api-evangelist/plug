  /v1/subacquirer/prepayment/receivables:
    get:
      operationId: listPrepaymentReceivables
      summary: Consultar recebíveis disponíveis para antecipação
      description: >
        > **🚧 Beta** — esta API está em fase Beta e detalhes do contrato podem
        evoluir nas próximas versões.


        Lista os recebíveis disponíveis para antecipação avulsa e retorna um
        resumo com o valor total disponível e a quantidade de recebíveis.


        Quando `sellerId` é informado, a consulta é feita sobre os recebíveis do
        recebedor correspondente. Sem `sellerId`, opera sobre a conta principal.
      parameters:
        - name: sellerId
          in: query
          required: false
          description: ID do recebedor para consultar os recebíveis dele.
          schema:
            type: string
      responses:
        '200':
          description: Recebíveis disponíveis retornados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepaymentReceivablesResponse'
              examples:
                PrepaymentReceivablesResponse:
                  $ref: '#/components/examples/PrepaymentReceivablesResponse'
        '400':
          description: Header `X-Client-Id` ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >-
            Conta ainda não habilitada para antecipação. Entre em contato com o
            suporte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepaymentError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Prepayment
  /v1/subacquirer/prepayment:
    post:
      operationId: simulatePrepayment
      summary: Simular antecipação
      description: >
        > **🚧 Beta** — esta API está em fase Beta e detalhes do contrato podem
        evoluir nas próximas versões.


        Cria uma simulação de antecipação para o **período que termina em
        `endDate`**. A Malga inclui **todos os recebíveis elegíveis com data
        prevista de recebimento até `endDate` (inclusive)** e calcula o valor
        líquido a ser recebido pelo cliente, junto com o desconto aplicado.


        A simulação fica válida até as **15h (horário de Brasília)** do dia em
        que foi criada (campo `expiresAt`). Para receber em D+1, o aceite
        precisa acontecer dentro desse prazo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrepaymentSimulateRequest'
            examples:
              PrepaymentSimulateRequest:
                $ref: '#/components/examples/PrepaymentSimulateRequest'
      responses:
        '201':
          description: Simulação criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepaymentResponse'
              examples:
                PrepaymentResponse:
                  $ref: '#/components/examples/PrepaymentResponse'
        '400':
          description: Body inválido ou header obrigatório ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >-
            Conta ainda não habilitada para antecipação. Entre em contato com o
            suporte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepaymentError'
        '404':
          description: Conta sem recebíveis associados ao provedor Malga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepaymentError'
        '422':
          description: Nenhum recebível disponível para o período informado (até `endDate`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepaymentError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Prepayment
  /v1/subacquirer/prepayment/{id}:
    get:
      operationId: getPrepayment
      summary: Recuperar detalhes de uma antecipação
      description: >
        > **🚧 Beta** — esta API está em fase Beta e detalhes do contrato podem
        evoluir nas próximas versões.


        Retorna os detalhes de uma simulação ou antecipação pelo seu
        identificador.


        Se a simulação ainda está com status `pending` mas o horário atual já
        passou do `expiresAt` (15h, horário de Brasília), o `status` retornado
        vem como `expired` automaticamente. Nesse caso, basta criar uma nova
        simulação.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador da antecipação.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhes da antecipação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepaymentResponse'
              examples:
                PrepaymentResponse:
                  $ref: '#/components/examples/PrepaymentResponse'
        '400':
          description: Header obrigatório ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Antecipação não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepaymentError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Prepayment
  /v1/subacquirer/prepayment/{id}/commit:
    post:
      operationId: commitPrepayment
      summary: Confirmar antecipação (aceite)
      description: >
        > **🚧 Beta** — esta API está em fase Beta e detalhes do contrato podem
        evoluir nas próximas versões.


        Confirma o aceite de uma simulação, efetivando a antecipação.


        Para receber em D+1, o aceite precisa acontecer até as **15h (horário de
        Brasília)** do dia em que a simulação foi criada. Após esse horário, a
        simulação fica expirada e é preciso simular novamente.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador da antecipação a ser aceita.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Antecipação confirmada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepaymentResponse'
              examples:
                PrepaymentCommittedResponse:
                  $ref: '#/components/examples/PrepaymentCommittedResponse'
        '400':
          description: Header obrigatório ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Antecipação não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepaymentError'
        '409':
          description: >-
            Antecipação não está mais pendente ou simulação expirou (passou de
            15h do dia da criação)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepaymentError'
        '422':
          description: Os recebíveis mudaram desde a simulação. Faça uma nova simulação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrepaymentError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
        - Prepayment
security:
  - X-Client-ID: []
    X-Api-Key: []
components:
  securitySchemes:
    X-Client-ID:
      type: apiKey
      in: header
      name: X-Client-Id
    X-Api-Key:
      type: apiKey
      in: header
      name: X-Api-Key
  schemas:
    MerchantAcquirerSingleMid:
      type: object
      description: Informações do adquirente
      title: MID único
      required:
        - merchantId
      properties:
        merchantId:
          type: string
          description: >-
            ID do merchant. Obrigatório se não estiver em cada BIN. Caso esteja
            aqui no nível superior ele irá usar esse merchantId para todas as
            bandeiras.
          example: '1234567890'
        bin:
          type: array
          description: BINs do adquirente
          items:
            type: object
            required:
              - merchantId
            properties:
              brand:
                type: string
                description: Bandeira do BIN
                example: Mastercard
              value:
                type: string
                description: Valor do BIN
                example: '550259'
    MerchantAcquirerMultipleMid:
      type: object
      description: Informações do adquirente
      title: Múltiplos MID's
      properties:
        bin:
          type: array
          description: BINs do adquirente
          items:
            type: object
            required:
              - merchantId
            properties:
              merchantId:
                type: string
                description: >-
                  ID do merchant. Obrigatório se não estiver cadastrado no nível
                  superior. Caso esteja nesse nível ele irá usar o merchantId
                  para cada respectivo BIN.
                example: '1234567890'
              brand:
                type: string
                description: Bandeira do BIN
                example: Mastercard
              value:
                type: string
                description: Valor do BIN
                example: '550259'
    PaySession201Response:
      properties:
        id:
          type: string
          description: Identificador da transação
        clientId:
          type: string
          format: uuid
          description: Identificador do cliente na Malga
        merchantId:
          type: string
          format: uuid
          description: Identificador do merchant id utilizado na transação
        description:
          type: string
          description: Descrição da cobrança para consulta futura
        orderId:
          type: string
          description: >-
            Identificador único da cobrança do lado do cliente para conciliação
            futura
        createdAt:
          type: string
          description: Data de criação do cartão
        amount:
          type: number
          description: Valor da transação em centavos, exemplo 100 para cobrar R$ 1,00
        originalAmount:
          type: number
          description: >-
            Valor original da transação em centavos, exemplo 100 para cobrar R$
            1,00
        currency:
          type: string
          description: >-
            Identificador da moeda para processamento da cobrança, formato ISO
            4217.
          default: BRL
        statementDescriptor:
          type: string
          description: Descrição a ser exibida na fatura do comprador
        status:
          type: string
          enum:
            - created
            - paid
            - canceled
            - voided
          description: Status da sessão
        paymentMethod:
          oneOf:
            - $ref: '#/components/schemas/PaymentMethodCardObject'
            - $ref: '#/components/schemas/PaymentMethodPixObject'
            - $ref: '#/components/schemas/PaymentMethodBoletoObject'
            - $ref: '#/components/schemas/PaySessionPaymentMethodDripObjectResponse'
            - $ref: '#/components/schemas/PaymentMethodNupayObjectRequest'
        paymentSource:
          oneOf:
            - $ref: '#/components/schemas/SourceTypeCardObject'
            - $ref: '#/components/schemas/SourceTypeTokenObject'
            - $ref: '#/components/schemas/SourceTypeCustomerObject'
        transactionRequests:
          type: array
          items:
            $ref: '#/components/schemas/TransactionRequest'
        platformFee:
          allOf:
            - $ref: '#/components/schemas/PlatformFeeAppliedOutput'
          description: >
            Detalhes da taxa de plataforma aplicada na cobrança quando há
            `splitRules` e o merchant tem platform fee habilitado. Ausente
            quando não há aplicação de platform fee.
    PaySessionRequest:
      description: >
        Corpo para pagamento da sessão (`paymentMethod` e `paymentSource`). Se
        existir split, as regras foram definidas na **criação da sessão**
        (`splitRules` em POST /v1/sessions) e são aplicadas ao processar esta
        cobrança; não envie `splitRules` aqui.
      properties:
        customerId:
          type: string
          format: uuid
          description: Identificador de comprador para consulta futura
        paymentMethod:
          description: Define o método de cobrança
          oneOf:
            - $ref: '#/components/schemas/PaymentMethodCard'
            - $ref: '#/components/schemas/PaymentMethodPixObjectRequest'
            - $ref: '#/components/schemas/PaymentMethodBoleto'
            - $ref: '#/components/schemas/PaySessionPaymentMethodDripObjectRequest'
            - $ref: '#/components/schemas/PaymentSessionNuPay'
            - $ref: '#/components/schemas/PaymentMethodClickToPay'
        paymentSource:
          oneOf:
            - $ref: '#/components/schemas/SourceTypeCard'
            - $ref: '#/components/schemas/SourceTypeCardOneShot'
            - $ref: '#/components/schemas/SourceTypeToken'
            - $ref: '#/components/schemas/SourceTypeCustomer'
            - $ref: '#/components/schemas/SourceTypeCustomerData'
            - $ref: '#/components/schemas/SourceTypeClickToPay'
        fraudAnalysis:
          description: >-
            Parâmetros adicionais para análise de fraude. Alguns destes campos
            podem ser necessários para processar com provedores específicos.
          allOf:
            - $ref: '#/components/schemas/FraudAnalysisRequest'
      required:
        - paymentMethod
        - paymentSource
    PatchSessionRequest:
      type: object
      properties:
        isActive:
          type: boolean
          description: >-
            Ativa ou desativa o link de pagamento da sessão. Sessões já pagas,
            canceladas ou expiradas não podem ser reativadas.
        dueDate:
          type: string
          nullable: true
          description: >
            Atualiza a data limite da sessão, em ISO 8601 (com horário, ex.:
            `2026-01-17T20:00:00Z`, ou apenas data, ex.: `2026-02-20`).

            Quando informado, o dia calendário em **America/Sao_Paulo** deve ser
            **hoje ou no futuro**.

            Enviar `null` remove a `dueDate`: a sessão deixa de expirar por
            vencimento.
        maxPayments:
          oneOf:
            - type: integer
              enum:
                - -1
              description: Link 1:N ilimitado.
            - type: integer
              minimum: 1
              maximum: 99999
              description: Link 1:N com limite finito de pagamentos.
          description: >
            Atualiza a capacidade de pagamentos em sessões 1:N.

            Aceita `-1` (ilimitado) ou um valor inteiro entre `1` e `99999`.

            `0`, valores menores que `-1` e valores acima de `99999` são
            inválidos.
      required:
        - isActive
    PatchSession200Response:
