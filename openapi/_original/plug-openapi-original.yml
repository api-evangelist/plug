        - $ref: '#/components/schemas/SourceTypeTokenObject'
      example:
        sourceType: card
        cardId: 148d5db0-f1c3-439f-902d-f1f268086e1d
    CardRequest:
      required:
        - tokenId
      properties:
        tokenId:
          type: string
          format: uuid
          description: Identificador do token gerado
        merchantId:
          type: string
          format: uuid
          description: >-
            Caso queria validar o cartão via zero dollar, informe o merchantId
            que possui pelo menos 1 provedor com suporte a validação zero
            dollar.
        cvvCheck:
          type: boolean
          description: >-
            Mesmo informando o merchantId, é possível desabilitar a validação do
            cvv (zero dollar). Informe true para validar ou false para pular a
            validação. Caso você informe false, a verificação será pulada e o
            cartão será criado como pending necessitando validar via uma
            transação.
