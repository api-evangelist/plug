      properties:
        id:
          type: string
          description: Identificador do merchant
        createdAt:
          type: string
          description: Data de criação
        clientId:
          type: string
          format: uuid
          description: Identificador do client
        mcc:
          type: string
          description: Código mcc do cadatro do lojista no adquirente
        status:
          type: string
          enum:
            - active
            - deleted
            - pending
          description: Status do merchant
        providers:
          $ref: '#/components/schemas/ProviderDto'
        platformFeeEnabled:
          type: boolean
          description: Indica se o platform fee está ativo para o merchant
          example: false
        platformFees:
          type: array
          description: Regras de platform fee cadastradas para o merchant
          items:
            $ref: '#/components/schemas/PlatformFeeOutput'
    MerchantList:
      properties:
        meta:
          type: object
          allOf:
            - $ref: '#/components/schemas/MetaPagination'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Merchant'
    CreatePlatformFeeDto:
      type: object
      required:
        - paymentMethod
      properties:
        percentage:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: >-
            Percentual da taxa (0-100) com até 2 casas decimais. Ao menos um
            entre `percentage` e `fixedAmount` deve ser informado.
          example: 2.5
        fixedAmount:
          type: integer
          minimum: 0
          description: >-
            Valor fixo da taxa em centavos (>= 0). Ao menos um entre
            `percentage` e `fixedAmount` deve ser informado.
          example: 50
        paymentMethod:
          type: string
          enum:
            - credit
            - pix
            - boleto
            - default
          description: >
            Método de pagamento ao qual a regra se aplica. Use `default` para
            regras de fallback quando não houver regra específica para o método
            da transação. Nota: `default` não aceita `installment`.
          example: credit
        installment:
          type: integer
          minimum: 1
          maximum: 24
          description: >
            Número de parcelas. **Obrigatório** quando `paymentMethod` for
            `credit`; **proibido** nos demais. O valor informado (1-24) é
            agrupado em faixas de parcelamento. Apenas uma regra por faixa é
            permitida por merchant. Faixas: à vista (1), 2x a 6x (2-6), 7x a 12x
            (7-12), 13x a 24x (13-24). O valor original é armazenado e
            retornado; a unicidade é validada por faixa.
          example: 5
    TogglePlatformFeeDto:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: >-
            Define se o platform fee está ativo (`true`) ou inativo (`false`)
            para o merchant
          example: true
    TogglePlatformFeeResponse:
      type: object
      properties:
        platformFeeEnabled:
          type: boolean
          description: Estado atual do platform fee para o merchant
          example: true
    PlatformFeeOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único da regra de platform fee
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        percentage:
          type: number
          format: float
          description: Percentual da taxa aplicado
          example: 2.5
          nullable: true
        fixedAmount:
          type: integer
          description: Valor fixo da taxa em centavos
          example: 50
          nullable: true
        paymentMethod:
          type: string
          enum:
            - credit
            - pix
            - boleto
            - default
          description: >
            Método de pagamento ao qual a regra se aplica (`default` indica
            regra de fallback).
          example: credit
        installment:
          type: integer
          description: >
            Número de parcelas informado na criação da regra. Presente apenas
            para `credit`; null para `pix`, `boleto` e `default`. A unicidade é
            validada por faixa: à vista (1), 2x a 6x (2-6), 7x a 12x (7-12), 13x
            a 24x (13-24).
          example: 5
          nullable: true
        createdAt:
          type: string
          format: date-time
          description: Data de criação da regra
          example: '2024-01-15T10:30:00.000Z'
        updatedAt:
          type: string
          format: date-time
          description: Data da última atualização da regra
          example: '2024-01-15T10:30:00.000Z'
    PlatformFeeListOutput:
      type: object
      required:
        - platformFeeEnabled
        - rules
      properties:
        platformFeeEnabled:
          type: boolean
          description: Indica se o platform fee está ativo para o merchant
          example: true
        rules:
          type: array
          description: Regras de platform fee ativas cadastradas para o merchant
          items:
            $ref: '#/components/schemas/PlatformFeeOutput'
    PlatformFeeAppliedOutput:
      type: object
      description: >-
        Snapshot da platform fee aplicada em uma cobrança (retorno
        transacional).
      required:
        - ruleId
        - paymentMethod
        - amount
        - appliedAt
      properties:
        ruleId:
          type: string
          format: uuid
          description: Identificador da regra de platform fee aplicada
        percentage:
          type: number
          format: float
          nullable: true
          description: Percentual da regra no momento da aplicação (quando houver)
        fixedAmount:
          type: integer
          nullable: true
          description: >-
            Valor fixo da regra em centavos no momento da aplicação (quando
            houver)
        paymentMethod:
          type: string
          description: >-
            Método de pagamento associado à regra aplicada (`credit`, `pix`,
            `boleto`, `default`, etc.)
        installment:
          type: integer
          minimum: 1
          maximum: 24
          nullable: true
          description: >-
            Parcelas informadas na regra aplicável; geralmente preenchido apenas
            para `credit`
        amount:
          type: integer
          description: Valor calculado da platform fee para a transação, em centavos
          example: 500
        appliedAt:
          type: string
          format: date-time
          description: Momento ISO 8601 em que a taxa foi aplicada no transacional
