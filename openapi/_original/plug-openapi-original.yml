          name: id
          schema:
            type: string
            format: uuid
          required: false
          description: Id da cobrança
        - in: query
          name: sessionId
          schema:
            type: string
            format: uuid
          required: false
          description: Id da sessão vinculada à cobrança
        - in: query
          name: originalAmount
          schema:
            type: number
          required: false
          description: Valor em centavos da cobrança
        - in: query
          name: status
          schema:
            type: string
            enum:
              - pending
              - pre_authorized
              - authorized
              - voided
              - refund_pending
              - canceled
              - charged_back
              - capture_pending
          required: false
          description: Status da cobrança
        - in: query
          name: paymentType
          schema:
            type: string
            enum:
              - credit
              - pix
              - boleto
          required: false
          description: Tipo de pagamento
        - in: query
          name: orderId
          schema:
            type: string
          required: false
          description: Id da cobrança gerado pelo cliente
        - in: query
          name: created
          schema:
            type: string
          required: false
          description: Registros criados em uma data específica
          example: '2022-03-12T12:43:53'
        - in: query
          name: created.gt
          schema:
            type: string
          required: false
          description: Registros com data maior que
          example: '2022-03-12T12:43:53'
        - in: query
          name: created.lt
          schema:
            type: string
          required: false
          description: Registros com data menor que
          example: '2022-03-12T12:43:53'
      responses:
        '200':
          description: Success
          content:
