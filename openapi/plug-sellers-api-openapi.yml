        fareFee:
          type: number
          minimum: 0
          description: Taxa fixa em centavos para split (Braspag)
        minNegativeBalance:
          type: number
          description: Saldo negativo mínimo permitido
        maxRefundDays:
          type: number
          description: Prazo máximo de reembolso em dias
