        clientSecret:
          type: string
          description: Client_secret da Picpay
      required:
      - type
      - clientId
      - clientSecret
    CreatePlatformFeeDto:
      type: object
      required:
      - paymentMethod
      properties:
        percentage:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Percentual da taxa (0-100) com até 2 casas decimais. Ao menos um entre `percentage` e `fixedAmount` deve ser informado.
          example: 2.5
        fixedAmount:
          type: integer
          minimum: 0
          description: Valor fixo da taxa em centavos (>= 0). Ao menos um entre `percentage` e `fixedAmount` deve ser informado.
          example: 50
        paymentMethod:
          type: string
          enum:
          - credit
          - pix
          - boleto
          - default
          description: 'Método de pagamento ao qual a regra se aplica. Use `default` para regras de fallback quando não houver regra específica para o método da transação. Nota: `default` não aceita `installment`.

            '
          example: credit
        installment:
          type: integer
          minimum: 1
          maximum: 24
          description: 'Número de parcelas. **Obrigatório** quando `paymentMethod` for `credit`; **proibido** nos demais. O valor informado (1-24) é agrupado em faixas de parcelamento. Apenas uma regra por faixa é permitida por merchant. Faixas: à vista (1), 2x a 6x (2-6), 7x a 12x (7-12), 13x a 24x (13-24). O valor original é armazenado e retornado; a unicidade é validada por faixa.

            '
          example: 5
