    MultiplePayments:
      type: object
      description: 'Estado do link de pagamento para receber uma próxima cobrança.


        - **Sessões 1:1** retornam `allow=false`, `maxPayments=null` e `status` derivado da disponibilidade do link.

        - **Sessões 1:N** (criadas com `maxPayments`) retornam `allow=true` e `status` reflete capacidade restante e estado da sessão.

        '
      properties:
        allow:
          type: boolean
          description: '`true` em sessões 1:N (com `maxPayments` configurado); `false` em sessões 1:1.

            '
        maxPayments:
          type: integer
          nullable: true
          description: 'Limite configurado para a sessão.

            `-1` indica ilimitado, valores entre `1` e `99999` indicam limite finito; `null` em sessões 1:1.

            '
        paymentCount:
          type: integer
          description: Quantidade de pagamentos já autorizados neste link.
        pendingCount:
          type: integer
          description: 'Quantidade de reservas pendentes de confirmação assíncrona neste link (ex.: Pix em aberto).

            '
        status:
          type: string
          enum:
          - active
          - disabled
          - canceled
          description: 'Disponibilidade conceitual do link para próxima cobrança:


            - `active`: link disponível.

            - `disabled`: link temporariamente indisponível (ex.: `isActive=false`, expiração por `dueDate`, ou limite atingido em 1:N). Estado reversível.

            - `canceled`: link cancelado ou anulado, estado terminal.


            O campo raiz `status` da sessão segue mantendo apenas `created`, `paid`, `canceled` ou `voided`.

            '
    SourceTypeCustomerObject:
      title: Customer
      type: object
      description: Identificador do comprador para cobrança
      properties:
        sourceType:
          type: string
          description: Tipo da origem da cobrança, usar `customer` para cobrança no cartão default do comprador
          enum:
          - customer
        customerId:
          type: string
          format: uuid
          description: Identificador do cliente quando source tipo customer, debitando o cartão default do comprador
      required:
      - sourceType
      - customerId
    PaySessionPaymentMethodDripObjectRequest:
      title: Drip
      type: object
      properties:
        paymentType:
          type: string
          enum:
          - drip
          description: Método da cobrança via Drip
        browser:
          description: Informações sobre o navegador do usuário
          allOf:
          - $ref: '#/components/schemas/DripBrowser'
      required:
      - paymentType
    PaySession201Response:
      properties:
        id:
          type: string
          description: Identificador da transação
        clientId:
          type: string
          format: uuid
          description: Identificador do cliente na Malga
        merchantId:
          type: string
          format: uuid
          description: Identificador do merchant id utilizado na transação
        description:
          type: string
          description: Descrição da cobrança para consulta futura
        orderId:
          type: string
          description: Identificador único da cobrança do lado do cliente para conciliação futura
        createdAt:
          type: string
          description: Data de criação do cartão
        amount:
          type: number
          description: Valor da transação em centavos, exemplo 100 para cobrar R$ 1,00
        originalAmount:
          type: number
          description: Valor original da transação em centavos, exemplo 100 para cobrar R$ 1,00
        currency:
          type: string
          description: Identificador da moeda para processamento da cobrança, formato ISO 4217.
          default: BRL
        statementDescriptor:
          type: string
          description: Descrição a ser exibida na fatura do comprador
        status:
          type: string
          enum:
          - created
          - paid
          - canceled
          - voided
          description: Status da sessão
        paymentMethod:
          oneOf:
          - $ref: '#/components/schemas/PaymentMethodCardObject'
          - $ref: '#/components/schemas/PaymentMethodPixObject'
          - $ref: '#/components/schemas/PaymentMethodBoletoObject'
          - $ref: '#/components/schemas/PaySessionPaymentMethodDripObjectResponse'
          - $ref: '#/components/schemas/PaymentMethodNupayObjectRequest'
        paymentSource:
          oneOf:
          - $ref: '#/components/schemas/SourceTypeCardObject'
          - $ref: '#/components/schemas/SourceTypeTokenObject'
          - $ref: '#/components/schemas/SourceTypeCustomerObject'
        transactionRequests:
          type: array
          items:
            $ref: '#/components/schemas/TransactionRequest'
        platformFee:
          allOf:
          - $ref: '#/components/schemas/PlatformFeeAppliedOutput'
          description: 'Detalhes da taxa de plataforma aplicada na cobrança quando há `splitRules` e o merchant tem platform fee habilitado. Ausente quando não há aplicação de platform fee.

            '
    NupayRecipient:
      title: Beneficiário final NuPay
