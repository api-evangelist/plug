aid: plug
name: Malga
description: >-
  Malga (formerly Plug / plugpagamentos.com) is a Brazilian intelligent payment
  infrastructure and orchestration platform. It lets companies route transactions
  across multiple acquirers, payment providers, methods (card, Pix, boleto, wallets
  such as PicPay and Apple Pay) and anti-fraud engines from a single API, with smart
  routing/retry flows, tokenization, 3D Secure 2, subscriptions/recurrence, split
  payments, sellers/payouts and a GraphQL analytics API. Malga is PCI DSS Level 1
  compliant and backed by Lightspeed Venture Partners and QED Investors.
