- aid: plug:plug-merchants-api
  name: Malga Merchants API
  description: >-
    Através das APIs de `merchants` é possível realizar a criação e configuração de sub contas na Malga.
    Uma sub conta, ou um `merchant`, é um cadastro de estabelecimento comercial que você tenha junto há
    um dos provedores de pagamentos integrados pela Malga. Uma vez que você tenha uma conta criada em
    um dos provedores aceitos, basta você solicitar suas credenciais de acesso ao parceiro e configurar
    seu cadastro na Malga.


    No cadastro de `merchant` é necessário informar o código da categoria `mcc` do seu cadastro junto
    ao provedor, escolher um dos tipos de provedores suportados pela Malga, e definir a prioridade do
    provedor com suas credenciais de acesso à API do provedor.


    O sistema de roteamento inteligente de transações da Malga foi desenvolvido de maneira a suportar
    o uso de múltiplos provedores por cadastro de estabelecimento. Usamos a prioridade definida no cadastro
    dos provedores para priorizar um determinado provedor em relação à outro, dessa forma você consegue
    gerenciar a ordem de provedores que será utilizado para fazer as retentativas.


    ### Consulte a [tabela de provedores aceitos](#section/Provedores-e-meios-de-pagamentos-suportados)
    para cadastro de credenciais


    ### Consulte a [tabela de código MCC](api-reference/type-tables/mcc-code.mdx) para cadastro de Merchants


    **Dados básicos do objeto do tipo merchant**


