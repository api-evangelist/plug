- aid: plug:plug-sellers-api
  name: Malga Sellers API
  description: >-
    Para realizar uma cobrança com Split, antes é necessário criar um `seller`. Os `sellers` são identificados
    a partir de um id único.


    Através das APIs de `sellers` é possível realizar a criação e configuração de recebedores que serão
    beneficiados em um Split. Um recebedor, ou `seller`, é um cadastro de pessoa física ou jurídica para
    quem você deseja repassar automaticamente valores de uma cobrança.


    É obrigatório informar o campo `owner` para recebedores do tipo pessoa física. Para pessoa jurídica,
    informe `owner` e `business`.


    Status possíveis: `pending`, `active`, `partial`, `inactive` e `blocked`.


