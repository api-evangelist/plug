- aid: plug:plug-prepayment-api
  name: Malga Prepayment API
  description: >-
    > **🚧 Beta** — esta API está em fase Beta. Já está disponível para clientes habilitados, mas detalhes
    do contrato e do fluxo podem evoluir nas próximas versões.


    **Antecipação avulsa de recebíveis.** Permite que clientes habilitados recebam antes da data prevista
    os recebíveis das suas vendas, mediante desconto proporcional ao tempo antecipado.


    ### Pré-requisitos


    - Transacionar pelo **provedor de pagamento Malga** (a antecipação não está disponível para transações
    feitas por outros provedores conectados à plataforma).

    - Sua conta precisa estar **habilitada** para antecipar recebíveis. Para solicitar a habilitação,
    entre em contato com o suporte. A solicitação passa por uma análise antes de ser aprovada.


    ### Fluxo


    1. Consulte os recebíveis disponíveis para antecipação.

    2. Simule a antecipação informando uma ou mais datas de recebimento — a Malga agrupa todos os recebíveis
    previstos para cada data informada.

    3. Confirme a simulação para efetivar a antecipação. Para receber em D+1, o aceite precisa acontecer
    **até as 15h (horário de Brasília)** do dia da simulação.


    Detalhes do guia conceitual em [Antecipação avulsa](/documentations/more/prepayment).
  humanURL: https://docs.malga.io/api-reference/about-apis
  baseURL: https://api.malga.io
  tags:
  - Prepayment
  properties:
  - type: OpenAPI
    url: openapi/plug-prepayment-api-openapi.yml
  - type: Documentation
    url: https://docs.malga.io/documentations/welcome/introduction
  - type: APIReference
    url: https://docs.malga.io/api-reference/about-apis
  - type: Authentication
