- aid: plug:plug-settings-api
  name: Malga Settings API
  description: >-
    Através da API de `settings` é possível recuperar, criar e atualizar configurações de personalização
    de link de pagamento de um determinado `clientId`. É possível também configurar branding específico
    por merchant, enviando o header opcional `X-Merchant-Id`. Quando o header é enviado no **GET**, o
    sistema busca primeiro a configuração do merchant; se não existir, retorna a configuração padrão do
    cliente (fallback automático). Em **POST/PATCH**, o escopo é exato (sem fallback).


    **PATCH:** aceita `multipart/form-data` (inclui upload de logo) ou `application/json` (somente campos
    textuais). Campos vazios são ignorados no update. Se nenhum campo efetivo for enviado, a API retorna
    `422`.
